  #scene{position:fixed;inset:0;z-index:0;display:block}
  .veil{position:fixed;inset:0;z-index:1;pointer-events:none;

  .mantra-line.show{opacity:1;}
  .book-line{font-family:var(--serif);font-style:italic;font-size:10.5pt;color:var(--gold);
    min-height:2.4em;max-width:32rem;margin-top:1rem;opacity:0;transition:opacity 1.2s ease;line-height:1.8;}
  .book-line.show{opacity:0.9;}

  .puja-line.show{opacity:0.7;}
  .controls{position:fixed;bottom:18px;right:18px;z-index:3;display:flex;flex-wrap:wrap;gap:8px;

  .btn.active{color:var(--ember);border-color:rgba(255,122,61,0.7);}
  .status{position:fixed;bottom:20px;left:18px;z-index:3;font-family:var(--mono);

<script>
/* ═══ DREAM.VAKED.DEV — Milarepa útja ═══
   A gyakorlat hangja és képe. Élő Web Audio szintézis: a 17 Karmapa
   vonal-kórusa (formáns-szintézissel énekelt OM·AH·HUM), mantrák,
   púdzsa-hangok (harang, dob, ének), a könyv hangos olvasása
   (SpeechSynthesis), és Milarepa útjának vizuáljai a canvasen. */
(function () {
  "use strict";
  var AC = window.AudioContext || window.webkitAudioContext;
  var ctx = null, master = null, verb = null;
  var btnJourney = document.getElementById("btnJourney");
  var btnMantra = document.getElementById("btnMantra");
  var btnChorus = document.getElementById("btnChorus");
  var btnBook = document.getElementById("btnBook");
  var btnPuja = document.getElementById("btnPuja");
  var btnAll = document.getElementById("btnAll");
  var statusEl = document.getElementById("status");
  var stageLabel = document.getElementById("stageLabel");
  var stageHan = document.getElementById("stageHan");
  var stageTitle = document.getElementById("stageTitle");
  var stageDesc = document.getElementById("stageDesc");
  var mantraEl = document.getElementById("mantraLine");
  var bookEl = document.getElementById("bookLine");
  var pujaEl = document.getElementById("pujaLine");

  var journeyOn = false, mantraOn = false, chorusOn = false, bookOn = false, pujaOn = false;
  var journeyTimer = null, mantraTimer = null, chorusTimer = null, pujaTimer = null;
  var stageIdx = 0;
  var BPM = 60, BEAT = 60 / BPM, SIXTEENTH = BEAT / 4;

  /* ── Milarepa útjának állomásai ── */
  var STAGES = [
    { han:"我", label:"I. Az ego", title:"Az ego — Mila Thöpaga, a varázsló",
      desc:"A fiatal Mila, akit a családja elárult — és aki fekete mágiát tanult, hogy bosszút álljon. A düh, amely még nem tudja, hogy szeretet." },
    { han:"灭", label:"II. Az ego-halál", title:"Az ego-halál — a harmincöt",
      desc:"Harmincöt embert ölt meg fekete mágiával. A bosszú beteljesült — és a beteljesülés ürességet hagyott. Az ego, amely szembenéz azzal, amit tett." },
    { han:"静", label:"III. A belső csend", title:"A barlang csendje",
      desc:"Marpa próbái, a kőfalak, a csalán-étel, a jégtakaró. A gyakorlat tüze, amelyben a düh átégetődik. A csend, amelyben a fény felismerhető." },
    { han:"罪", label:"IV. A kilenc bűn", title:"A kilenc bűn — a fekete mágia",
      desc:"A kilenc fekete bűn, amelyet a varázsló elkövetett. A megbánás, amely nem tagadja a bűnt — hanem átégeti. A bűnök a gyakorlat anyaga." },
    { han:"悟", label:"V. A megvalósítás", title:"A megvalósítás — a düh, amely szeretetté érlelődött",
      desc:"A gyakorlat tüze átégette a dühöt. A düh nem tűnt el — szeretetté érlelődött. A Mahakala dühe a szeretet sűrű formája." },
    { han:"醒", label:"VI. Az ébredés", title:"Az ébredés — az álom-meditáció",
      desc:"Az álom a valóság vetülete. Aki felismeri, hogy álmodik, a valóságban is felismeri, hogy vetület. A felismerés a fény." },
    { han:"空", label:"VII. Az üresség", title:"Az üresség — a vetület mögött",
      desc:"A test szimulákrum, a jelenségek illuzórikusak, a világ vetület. Az üresség nem a világ hiánya — a világ olvasása vetületként." },
    { han:"觉", label:"VIII. A megvilágosodás", title:"A megvilágosodás — a szivárvány-test",
      desc:"A dal, amely hajnalban és alkonyatkor szól. A test, amely könyvvé vált. A szivárvány-test — a fény, amely nem a tükröt keresi, mert a fény a dal." }
  ];

  /* ── A 17 Karmapa — a vonal nevei ── */
  var KARMAPAS = [
    "Düsum Khyenpa","Karma Pakshi","Rangjung Dorje","Rolpe Dorje",
    "Deshin Shekpa","Thongwa Dönden","Chödrak Gyatso","Mikyö Dorje",
    "Wangchuk Dorje","Chöying Dorje","Yeshe Dorje","Changchub Dorje",
    "Düdul Dorje","Thekchok Dorje","Khakyab Dorje","Rangjung Rigpe Dorje",
    "Ogyen Trinley Dorje"
  ];

  /* ── A könyv hangos olvasása — a tanítás szövege ── */
  var BOOK_LINES = [
    "Az álom a valóság vetülete. A gyakorlat egyetlen felismerés: az álomban felismered, hogy álom.",
    "És ez a felismerés nem marad az álomban — átviszi magát az éber állapotra.",
    "Aki egyszer felismerte, hogy álmodik, az a valóságban is felismeri, hogy vetület.",
    "A test, amelyben ülsz, szimulákrum. Nem azért, mert nem valódi — azért, mert vetület.",
    "A bőr a határ, amely nem elválaszt, hanem visszahajt. A szimbólumok emlékeztetők, nem díszek.",
    "Harmincöt embert öltem meg fekete mágiával, mielőtt a gyakorlat tüzén át-égettem a dühömet.",
    "A düh nem tűnt el — szeretetté érlelődött. Ez a tűz a fény.",
    "A fény nem a tartalom; a fény a felismerés. És a felismerés a gyakorlat tüze.",
    "A dal a gyakorlat eszköze — a meditáció folytatása hangban. OM, a test; AH, a beszéd; HUM, a tudat.",
    "A zene, amely az álomba visz: lassú, mély, ismétlődő. A ritmus a légzés, a dallam a fény.",
    "Az álom-meditáció nem az álomról szól. Az álom-meditáció az ébredésről szól.",
    "Aki ébren van az álomban, az ébren van a valóságban is — és mindkettőt látja.",
    "A hamu emlékszik. A gyűrűk forognak. A fény a te dalod — énekeld, amíg a test könyvvé nem válik."
  ];

  /* ── Véletlen púdzsák ── */
  var PUJAS = [
    "torma-felajánlás · harang · damaru",
    "hétágú fohász · OM AH HUM · mandala",
    "guru-jóga · a vonal áldása · füstölő",
    "tsok-felajánlás · ének · dob",
    "a menedék fohásza · a három drágaság",
    "Mahakala-púdzsa · a tűzgyűrű · a védelem",
    "a szív-szútra · a forma az üresség",
    "a hosszú élet púdzsája · a vonal folytonossága"
  ];

  /* ── Web Audio: a hangmotor ── */
  function midiFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

  function ensureCtx() {
    if (!ctx) {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.9;
      verb = ctx.createConvolver();
      // egyszerű késleltetéses "barlang" reverb
      var len = Math.floor(ctx.sampleRate * 2.5);
      var buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (var ch = 0; ch < 2; ch++) {
        var d = buf.getChannelData(ch);
        for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
      }
      verb.buffer = buf;
      var wet = ctx.createGain(); wet.gain.value = 0.35;
      verb.connect(wet); wet.connect(master);
    }
    return ctx;
  }

  function mkOsc(type, freq, t, dur, gain, dest, detune) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    if (detune) o.detune.value = detune;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.6 * dur);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || master);
    o.start(t); o.stop(t + dur + 0.1);
    return o;
  }

  /* Formáns-szintézis: egy "éneklő" hang, amely OM/AH/HUM magánhangzókat formál.
     A formánsok (F1, F2, F3) sávszűrőkön át a fűrészhullámot vokálissá teszik. */
  function chantVoice(freq, t, dur, vowel, gain, pan) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sawtooth"; o.frequency.value = freq;
    o.detune.value = (Math.random() * 10 - 5);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + dur * 0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    // vibrato
    var lfo = ctx.createOscillator(), lfoG = ctx.createGain();
    lfo.frequency.value = 4.5 + Math.random() * 1.5;
    lfoG.gain.value = freq * 0.008;
    lfo.connect(lfoG); lfoG.connect(o.frequency);
    lfo.start(t); lfo.stop(t + dur + 0.1);
    // formánsok
    var F = { om:[450,800,2600], ah:[700,1100,2600], hum:[300,700,2400] }[vowel] || [500,900,2600];
    var bp = [];
    for (var i = 0; i < 3; i++) {
      var f = ctx.createBiquadFilter();
      f.type = "bandpass"; f.frequency.value = F[i]; f.Q.value = 8;
      o.connect(f); f.connect(g);
    }
    var p = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    if (p) { p.pan.value = pan || 0; g.connect(p); p.connect(verb); }
    else g.connect(verb);
    o.start(t); o.stop(t + dur + 0.1);
    return o;
  }

  function bell(t, freq, dur, gain) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(gain || 0.06, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(verb);
    o.start(t); o.stop(t + dur + 0.1);
    // felharmonikusok
    mkOsc("sine", freq * 2.76, t, dur * 0.6, (gain || 0.06) * 0.3, verb);
    mkOsc("sine", freq * 5.4, t, dur * 0.4, (gain || 0.06) * 0.15, verb);
  }

  function drum(t, dur) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(110, t);
    o.frequency.exponentialRampToValueAtTime(45, t + dur);
    g.gain.setValueAtTime(0.12, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(verb);
    o.start(t); o.stop(t + dur + 0.1);
  }

  /* ── A 17 Karmapa kórusa: 17 éneklő hang, OM·AH·HUM körkánonban ── */
  function chorusStep(s, t) {
    var s16 = s % 16;
    // minden 4. ütemben egy új "Karmapa" lép be (körkánon)
    var karmapa = Math.floor(s / 16) % 17;
    if (s16 === 0) {
      var base = 65 + karmapa * 0.7; // a vonal mélyülő/emelkedő hangja
      var vowel = ["om","ah","hum"][karmapa % 3];
      var pan = Math.sin(karmapa * 0.7) * 0.8;
      chantVoice(base, t, BEAT * 3, vowel, 0.05, pan);
      chantVoice(base * 2.0, t, BEAT * 3, vowel, 0.03, pan * 0.5);
      // a karmapa neve megjelenik
      if (Math.random() < 0.3) {
        pujaEl.textContent = "a 17 Karmapa · " + KARMAPAS[karmapa];
        pujaEl.classList.add("show");
        setTimeout(function(){ pujaEl.classList.remove("show"); }, 3000);
      }
    }
    // mély padok
    if (s16 === 0) {
      var PADS = [[50,54,57],[47,50,54],[43,47,50],[45,49,52]];
      var bar = Math.floor(s / 16) % 4;
      for (var i = 0; i < 3; i++) mkOsc("triangle", midiFreq(PADS[bar][i]), t, BEAT * 4, 0.04, verb);
      mkOsc("sine", midiFreq([38,35,31,33][bar]), t, BEAT * 4, 0.07, verb);
    }
    // OM·AH·HUM a légzés ritmusában
    if (s16 === 0 || s16 === 8) {
      var f = (s16 === 0) ? 130.81 : 174.61;
      chantVoice(f, t, BEAT * 1.5, (s16 === 0) ? "om" : "ah", 0.04, 0);
    }
  }

  var chorusNext = 0, chorusStepIdx = 0;
  function chorusScheduler() {
    while (chorusNext < ctx.currentTime + 1.2) {
      if (chorusOn) chorusStep(chorusStepIdx, chorusNext);
      chorusNext += SIXTEENTH;
      chorusStepIdx = (chorusStepIdx + 1) % 64;
    }
  }

  /* ── Mantra: OM AH HUM ── */
  function mantraStep(s, t) {
    var s16 = s % 16;
    if (s16 === 0 || s16 === 8) {
      var f = (s16 === 0) ? 130.81 : 174.61;
      var v = (s16 === 0) ? "om" : "ah";
      chantVoice(f, t, BEAT * 2, v, 0.05, 0);
      chantVoice(f * 1.5, t, BEAT * 2, v, 0.03, -0.3);
      chantVoice(f * 0.75, t, BEAT * 2, v, 0.03, 0.3);
      bell(t, 880, 2, 0.03);
    }
    if (s16 === 4) { chantVoice(98, t, BEAT * 2, "hum", 0.04, 0); }
  }
  var mantraNext = 0, mantraStepIdx = 0;
  function mantraScheduler() {
    while (mantraNext < ctx.currentTime + 1.2) {
      if (mantraOn) mantraStep(mantraStepIdx, mantraNext);
      mantraNext += SIXTEENTH;
      mantraStepIdx = (mantraStepIdx + 1) % 64;
    }
  }

  /* ── Véletlen púdzsa ── */
  function doPuja() {
    var p = PUJAS[Math.floor(Math.random() * PUJAS.length)];
    pujaEl.textContent = "púdzsa · " + p;
    pujaEl.classList.add("show");
    setTimeout(function(){ pujaEl.classList.remove("show"); }, 6000);
    var t = ctx.currentTime + 0.1;
    bell(t, 660, 3, 0.05);
    bell(t + 0.5, 880, 3, 0.04);
    drum(t + 1, 1.2);
    chantVoice(110, t + 1.5, 3, "om", 0.04, -0.4);
    chantVoice(146.83, t + 1.5, 3, "ah", 0.04, 0.4);
    chantVoice(98, t + 2.5, 3, "hum", 0.04, 0);
    setTimeout(function(){
      if (pujaOn) { pujaTimer = setTimeout(doPuja, 12000 + Math.random() * 8000); }
    }, 12000);
  }

  /* ── A könyv hangos olvasása ── */
  function readBook() {
    if (!("speechSynthesis" in window)) { statusEl.textContent = "a könyv hangos olvasása nem támogatott"; return; }
    var i = 0;
    bookEl.textContent = BOOK_LINES[0]; bookEl.classList.add("show");
    function speakNext() {
      if (!bookOn || i >= BOOK_LINES.length) { bookEl.classList.remove("show"); return; }
      bookEl.textContent = BOOK_LINES[i];
      var u = new SpeechSynthesisUtterance(BOOK_LINES[i]);
      u.lang = "hu-HU"; u.rate = 0.85; u.pitch = 0.9; u.volume = 0.9;
      u.onend = function () { i++; speakNext(); };
      u.onerror = function () { bookEl.classList.remove("show"); };
      speechSynthesis.speak(u);
    }
    speakNext();
  }

  /* ── A vizuál: Milarepa útja a canvasen ── */
  var canvas = document.getElementById("scene");
  var c2d = canvas.getContext("2d");
  var W, H;
  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  window.addEventListener("resize", resize); resize();

  var particles = [];
  function initParticles() {
    particles = [];
    for (var i = 0; i < 160; i++) {
      particles.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*2+0.5,
        vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3,
        hue: Math.random()*40+10, a: Math.random()*0.5+0.2 });
    }
  }
  initParticles();

  var frame = 0;
  function draw() {
    frame++;
    c2d.clearRect(0, 0, W, H);
    var st = STAGES[stageIdx];
    // a háttér színe az állomás szerint
    var bgHue = [20, 0, 210, 260, 30, 180, 200, 45][stageIdx];
    var grad = c2d.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.7);
    grad.addColorStop(0, "hsla("+bgHue+",60%,12%,0.9)");
    grad.addColorStop(1, "#080406");
    c2d.fillStyle = grad; c2d.fillRect(0, 0, W, H);

    // a tűzgyűrű (Mahakala) — a megvilágosodásnál a legfényesebb
    var ringR = Math.min(W, H) * 0.32;
    var ringA = (stageIdx >= 6) ? 0.5 + 0.3 * Math.sin(frame * 0.02) : 0.18 + 0.08 * Math.sin(frame * 0.03);
    c2d.beginPath();
    c2d.arc(W/2, H/2, ringR, 0, Math.PI * 2);
    c2d.strokeStyle = "hsla("+bgHue+",90%,55%,"+ringA+")";
    c2d.lineWidth = 2;
    c2d.stroke();
    // a gyűrű lángjai
    for (var i = 0; i < 24; i++) {
      var ang = i / 24 * Math.PI * 2 + frame * 0.01;
      var rr = ringR + Math.sin(frame * 0.05 + i * 2) * 6;
      var x = W/2 + Math.cos(ang) * rr, y = H/2 + Math.sin(ang) * rr;
      c2d.beginPath();
      c2d.arc(x, y, 2 + Math.sin(frame*0.1+i)*1.5, 0, Math.PI*2);
      c2d.fillStyle = "hsla("+(bgHue+20)+",90%,60%,"+ringA+")";
      c2d.fill();
    }

    // a részecskék — a fény, amely a vetület alatt kavarog
    for (var p = 0; p < particles.length; p++) {
      var pt = particles[p];
      pt.x += pt.vx; pt.y += pt.vy;
      if (pt.x < 0) pt.x = W; if (pt.x > W) pt.x = 0;
      if (pt.y < 0) pt.y = H; if (pt.y > H) pt.y = 0;
      // a megvilágosodásnál a részecskék felfelé szállnak (a szivárvány-test)
      if (stageIdx >= 7) pt.y -= 0.4;
      var tw = 0.5 + 0.5 * Math.sin(frame * 0.02 + p);
      c2d.beginPath();
      c2d.arc(pt.x, pt.y, pt.r * (0.8 + tw * 0.6), 0, Math.PI * 2);
      c2d.fillStyle = "hsla("+(pt.hue+stageIdx*5)+",80%,65%,"+pt.a*tw+")";
      c2d.fill();
    }

    // a középső figura — Mila alakja, amely az út során átalakul
    var fy = H/2 + ringR * 0.4;
    var figH = ringR * 0.9;
    // a fej (a fény a megvalósítástól)
    c2d.beginPath();
    c2d.arc(W/2, fy - figH*0.35, figH*0.12, 0, Math.PI*2);
    c2d.fillStyle = stageIdx >= 4 ? "hsla(45,90%,70%,0.9)" : "hsla("+bgHue+",40%,50%,0.8)";
    c2d.fill();
    // a halo a megvilágosodásnál
    if (stageIdx >= 7) {
      c2d.beginPath();
      c2d.arc(W/2, fy - figH*0.35, figH*0.2 + Math.sin(frame*0.05)*4, 0, Math.PI*2);
      c2d.strokeStyle = "hsla(45,90%,75%,0.6)";
      c2d.lineWidth = 2; c2d.stroke();
    }
    // a test (a barlangban ülő alak)
    c2d.beginPath();
    c2d.moveTo(W/2 - figH*0.18, fy - figH*0.25);
    c2d.quadraticCurveTo(W/2, fy + figH*0.1, W/2 + figH*0.18, fy - figH*0.25);
    c2d.fillStyle = stageIdx >= 4 ? "hsla(45,70%,60%,0.5)" : "hsla("+bgHue+",30%,35%,0.5)";
    c2d.fill();
    // a keresztbe tett lábak (a meditáció)
    c2d.beginPath();
    c2d.arc(W/2, fy + figH*0.15, figH*0.16, Math.PI, 0);
    c2d.strokeStyle = stageIdx >= 4 ? "hsla(45,70%,60%,0.5)" : "hsla("+bgHue+",30%,35%,0.5)";
    c2d.lineWidth = 3; c2d.stroke();

    requestAnimationFrame(draw);
  }
  draw();

  /* ── Az út automatikus végigjárása ── */
  function showStage(i) {
    stageIdx = i;
    var st = STAGES[i];
    stageLabel.textContent = st.label;
    stageHan.textContent = st.han;
    stageTitle.textContent = st.title;
    stageDesc.textContent = st.desc;
    // a mantra a légzés ritmusában
    var mantras = ["OM","AH","HUM"];
    mantraEl.textContent = mantras[i % 3];
    mantraEl.classList.add("show");
    setTimeout(function(){ mantraEl.classList.remove("show"); }, 3000);
    // a púdzsa-sor a Karmapákkal
    pujaEl.textContent = "a vonal · " + KARMAPAS[i % 17];
    pujaEl.classList.add("show");
    setTimeout(function(){ pujaEl.classList.remove("show"); }, 4000);
  }

  function journey() {
    if (journeyOn) {
      journeyOn = false; clearInterval(journeyTimer);
      btnJourney.textContent = "▶ az út"; btnJourney.classList.remove("active");
      return;
    }
    ensureCtx();
    journeyOn = true;
    btnJourney.textContent = "■ az út"; btnJourney.classList.add("active");
    var i = 0;
    showStage(i);
    journeyTimer = setInterval(function () {
      i = (i + 1) % STAGES.length;
      showStage(i);
      // minden állomásnál egy harang
      bell(ctx.currentTime + 0.1, 660 + i * 40, 2.5, 0.04);
    }, 14000);
  }

  /* ── A gombok ── */
  btnJourney.addEventListener("click", journey);

  btnMantra.addEventListener("click", function () {
    ensureCtx();
    if (mantraOn) { mantraOn = false; clearInterval(mantraTimer); btnMantra.textContent = "▶ mantra"; btnMantra.classList.remove("active"); return; }
    mantraOn = true; btnMantra.textContent = "■ mantra"; btnMantra.classList.add("active");
    mantraNext = ctx.currentTime + 0.1; mantraStepIdx = 0;
    mantraTimer = setInterval(mantraScheduler, 25);
    statusEl.textContent = "OM · AH · HUM — a mantra szól";
  });

  btnChorus.addEventListener("click", function () {
    ensureCtx();
    if (chorusOn) { chorusOn = false; clearInterval(chorusTimer); btnChorus.textContent = "▶ 17 Karmapa"; btnChorus.classList.remove("active"); return; }
    chorusOn = true; btnChorus.textContent = "■ 17 Karmapa"; btnChorus.classList.add("active");
    chorusNext = ctx.currentTime + 0.1; chorusStepIdx = 0;
    chorusTimer = setInterval(chorusScheduler, 25);
    statusEl.textContent = "a 17 Karmapa vonal-kórusa szól";
  });

  btnBook.addEventListener("click", function () {
    ensureCtx();
    if (bookOn) { bookOn = false; speechSynthesis.cancel(); bookEl.classList.remove("show"); btnBook.textContent = "▶ könyv hanggal"; btnBook.classList.remove("active"); return; }
    bookOn = true; btnBook.textContent = "■ könyv hanggal"; btnBook.classList.add("active");
    readBook();
    statusEl.textContent = "a könyv hangos olvasása";
  });

  btnPuja.addEventListener("click", function () {
    ensureCtx();
    if (pujaOn) { pujaOn = false; clearTimeout(pujaTimer); pujaEl.classList.remove("show"); btnPuja.textContent = "▶ púdzsa"; btnPuja.classList.remove("active"); return; }
    pujaOn = true; btnPuja.textContent = "■ púdzsa"; btnPuja.classList.add("active");
    doPuja();
    statusEl.textContent = "véletlen púdzsa";
  });

  btnAll.addEventListener("click", function () {
    ensureCtx();
    var anyOn = mantraOn || chorusOn || bookOn || pujaOn || journeyOn;
    if (anyOn) {
      mantraOn = chorusOn = bookOn = pujaOn = journeyOn = false;
      [mantraTimer, chorusTimer, pujaTimer, journeyTimer].forEach(function(t){ if(t) clearInterval(t); });
      if (speechSynthesis) speechSynthesis.cancel();
      btnMantra.textContent = "▶ mantra"; btnChorus.textContent = "▶ 17 Karmapa";
      btnBook.textContent = "▶ könyv hanggal"; btnPuja.textContent = "▶ púdzsa"; btnJourney.textContent = "▶ az út";
      [btnMantra,btnChorus,btnBook,btnPuja,btnJourney].forEach(function(b){ b.classList.remove("active"); });
      bookEl.classList.remove("show"); pujaEl.classList.remove("show"); mantraEl.classList.remove("show");
      statusEl.textContent = "mindent leállítottam";
      return;
    }
    ensureCtx();
    mantraOn = true; btnMantra.textContent = "■ mantra"; btnMantra.classList.add("active");
    mantraNext = ctx.currentTime + 0.1; mantraStepIdx = 0;
    mantraTimer = setInterval(mantraScheduler, 25);
    chorusOn = true; btnChorus.textContent = "■ 17 Karmapa"; btnChorus.classList.add("active");
    chorusNext = ctx.currentTime + 0.1; chorusStepIdx = 0;
    chorusTimer = setInterval(chorusScheduler, 25);
    bookOn = true; btnBook.textContent = "■ könyv hanggal"; btnBook.classList.add("active");
    setTimeout(readBook, 800);
    pujaOn = true; btnPuja.textContent = "■ púdzsa"; btnPuja.classList.add("active");
    setTimeout(doPuja, 4000);
    journeyOn = true; btnJourney.textContent = "■ az út"; btnJourney.classList.add("active");
    var i = 0; showStage(i);
    journeyTimer = setInterval(function(){ i = (i+1) % STAGES.length; showStage(i); }, 14000);
    statusEl.textContent = "minden szól — az út, a mantra, a kórus, a könyv, a púdzsa";
  });

  // a kezdő állomás
  showStage(0);
})();
</script>
