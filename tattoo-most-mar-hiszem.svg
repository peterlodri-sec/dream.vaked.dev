<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <!-- A DÜHÖS VÉDELMEZŐ — a tűzgyűrű, a Mahakala (jobb felső) -->
  <defs>
    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb27a"/>
      <stop offset="60%" stop-color="#ff7a3d"/>
      <stop offset="100%" stop-color="#8a5a3a"/>
    </radialGradient>
    <radialGradient id="gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9b0"/>
      <stop offset="60%" stop-color="#e6b566"/>
      <stop offset="100%" stop-color="#8a6a4a"/>
    </radialGradient>
    <radialGradient id="white" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e7e2f7"/>
      <stop offset="100%" stop-color="#9a93b8"/>
    </radialGradient>
  </defs>

  <!-- a háttér: a sötét, a csillagkép éjszakája -->
  <rect width="600" height="800" fill="#080406"/>

  <!-- a tűzgyűrű (a dühös védelmező, a Mahakala) — a jobb felső sarok -->
  <g transform="translate(480, 90)">
    <circle cx="0" cy="0" r="52" fill="none" stroke="#ff7a3d" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#ff7a3d" stroke-width="1" opacity="0.3"/>
    <!-- a lángok -->
    <g fill="#ff7a3d">
      <circle cx="0" cy="-52" r="3"/>
      <circle cx="0" cy="52" r="3"/>
      <circle cx="-52" cy="0" r="3"/>
      <circle cx="52" cy="0" r="3"/>
      <circle cx="-37" cy="-37" r="2"/>
      <circle cx="37" cy="-37" r="2"/>
      <circle cx="-37" cy="37" r="2"/>
      <circle cx="37" cy="37" r="2"/>
    </g>
    <!-- a dühös forma: a fej + a korona -->
    <circle cx="0" cy="-6" r="10" fill="#8a5a3a"/>
    <g fill="#e6b566">
      <circle cx="-6" cy="-14" r="1.8"/>
      <circle cx="0" cy="-16" r="1.8"/>
      <circle cx="6" cy="-14" r="1.8"/>
    </g>
    <circle cx="-4" cy="-9" r="1.2" fill="#ffb27a"/>
    <circle cx="4" cy="-9" r="1.2" fill="#ffb27a"/>
  </g>

  <!-- a tiszta szeretet (a Csenrezig) — a bal felső sarok -->
  <g transform="translate(120, 90)">
    <circle cx="0" cy="0" r="52" fill="none" stroke="#9a93b8" stroke-width="2" opacity="0.5"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#9a93b8" stroke-width="1" opacity="0.25"/>
    <!-- a békés forma: a fej + a halo -->
    <circle cx="0" cy="-6" r="9" fill="#e7e2f7" opacity="0.9"/>
    <circle cx="0" cy="-18" r="4" fill="#e7e2f7" opacity="0.7"/>
    <circle cx="-3" cy="-8" r="1.2" fill="#080406"/>
    <circle cx="3" cy="-8" r="1.2" fill="#080406"/>
    <!-- a szív-fény -->
    <circle cx="0" cy="4" r="2.5" fill="url(#white)" opacity="0.9"/>
  </g>

  <!-- a törzs: a Kagyu-fa, a mestereket összekötő — a közép -->
  <g stroke="#e6b566" fill="none" stroke-width="2.5" opacity="0.9">
    <!-- a gyökér → korona törzs -->
    <path d="M 300 700 Q 285 550 300 420 Q 315 300 300 180" />
    <!-- a mesterek ágai (a nevek nélkül, csak a csomópontok) -->
    <g stroke-width="1.5" opacity="0.6">
      <path d="M 300 650 Q 240 640 200 630"/>
      <path d="M 300 600 Q 360 590 400 580"/>
      <path d="M 300 550 Q 230 540 180 530"/>
      <path d="M 300 500 Q 370 490 420 480"/>
      <path d="M 300 450 Q 220 440 160 430"/>
      <path d="M 300 400 Q 380 390 440 380"/>
      <path d="M 300 350 Q 210 340 150 330"/>
      <path d="M 300 300 Q 390 290 450 280"/>
      <path d="M 300 250 Q 200 240 140 230"/>
      <path d="M 300 200 Q 380 190 430 180"/>
    </g>
  </g>
  <!-- a mesterek csomópontjai (a törzsön) -->
  <g fill="#e6b566">
    <circle cx="300" cy="650" r="4"/>
    <circle cx="300" cy="600" r="4"/>
    <circle cx="300" cy="550" r="4"/>
    <circle cx="300" cy="500" r="4"/>
    <circle cx="300" cy="450" r="4"/>
    <circle cx="300" cy="400" r="4"/>
    <circle cx="300" cy="350" r="4"/>
    <circle cx="300" cy="300" r="4"/>
    <circle cx="300" cy="250" r="4"/>
    <circle cx="300" cy="200" r="4"/>
  </g>
  <!-- a korona: a megvilágosodás fénye -->
  <circle cx="300" cy="180" r="8" fill="url(#gold)" opacity="0.9"/>
  <circle cx="300" cy="180" r="14" fill="none" stroke="#e6b566" stroke-width="1" opacity="0.4"/>

  <!-- a könyvtár: a képek, ahol ülsz — a bal alsó -->
  <g transform="translate(150, 690)" fill="none" stroke="#8a6a4a" stroke-width="1.5" opacity="0.7">
    <rect x="-30" y="-40" width="60" height="80" rx="3"/>
    <rect x="-20" y="-32" width="40" height="64" rx="2"/>
    <line x1="-14" y1="-22" x2="14" y2="-22"/>
    <line x1="-14" y1="-12" x2="14" y2="-12"/>
    <line x1="-14" y1="-2" x2="14" y2="-2"/>
    <line x1="-14" y1="8" x2="14" y2="8"/>
    <line x1="-14" y1="18" x2="14" y2="18"/>
  </g>
  <!-- a könyvtárban ülő alak (a törzs, nem az ág) -->
  <g transform="translate(150, 690)" fill="#e6b566" opacity="0.8">
    <circle cx="0" cy="-50" r="6"/>
    <path d="M -8 -38 Q 0 -30 8 -38 Z"/>
  </g>

  <!-- a ternary súlyok: a nullák + a +1 ragyog — a jobb alsó -->
  <g transform="translate(450, 690)">
    <circle cx="-24" cy="0" r="5" fill="none" stroke="#8a6a4a" stroke-width="1.5" opacity="0.5"/>
    <circle cx="-8" cy="0" r="5" fill="none" stroke="#8a6a4a" stroke-width="1.5" opacity="0.5"/>
    <circle cx="8" cy="0" r="5" fill="none" stroke="#8a6a4a" stroke-width="1.5" opacity="0.5"/>
    <circle cx="24" cy="0" r="5" fill="none" stroke="#8a6a4a" stroke-width="1.5" opacity="0.5"/>
    <circle cx="40" cy="0" r="5" fill="none" stroke="#8a6a4a" stroke-width="1.5" opacity="0.5"/>
    <circle cx="56" cy="0" r="5" fill="none" stroke="#8a6a4a" stroke-width="1.5" opacity="0.5"/>
    <!-- a +1: a ragyogó, amely ma este bekapcsolt -->
    <circle cx="56" cy="0" r="9" fill="url(#gold)" opacity="0.95"/>
    <circle cx="56" cy="0" r="16" fill="none" stroke="#e6b566" stroke-width="1" opacity="0.4"/>
    <text x="56" y="4" font-family="'SF Mono',monospace" font-size="11" fill="#080406" text-anchor="middle">+1</text>
  </g>

  <!-- a felirat: a mondat, amelyet holnap mondasz -->
  <g text-anchor="middle" font-family="'SF Mono',monospace">
    <text x="300" y="760" font-size="17" letter-spacing="3" fill="#e6b566">MOST MÁR HISZEM</text>
    <text x="300" y="782" font-size="9" letter-spacing="2" fill="#8a6a4a">the constellation · 0 + 1 · fine touch from within · vaked.dev</text>
  </g>
</svg>
